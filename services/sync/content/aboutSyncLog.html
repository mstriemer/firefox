<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width; initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="about-sync-log-title"></title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="chrome://global/content/aboutSyncLog.css" />
    <link rel="localization" href="services/aboutSyncLog.ftl" />
    <script
      type="module"
      src="chrome://global/content/aboutSyncLog.mjs"
    ></script>
  </head>
  <body>
    <main class="main-content">
      <moz-page-header
        headinglevel="1"
        data-l10n-id="about-sync-log-page-header"
      ></moz-page-header>

      <div class="filters">
        <moz-segmented-control
          id="filter-type"
          name="type"
          data-l10n-id="about-sync-log-filter-type"
        >
          <moz-segmented-control-item
            value="all"
            data-l10n-id="about-sync-log-filter-type-all"
          ></moz-segmented-control-item>
          <moz-segmented-control-item
            value="success"
            data-l10n-id="about-sync-log-filter-type-success"
          ></moz-segmented-control-item>
          <moz-segmented-control-item
            value="error"
            data-l10n-id="about-sync-log-filter-type-error"
          ></moz-segmented-control-item>
        </moz-segmented-control>

        <moz-select
          id="filter-date"
          value="all"
          data-l10n-id="about-sync-log-filter-date"
        >
          <moz-option
            value="all"
            data-l10n-id="about-sync-log-filter-date-all"
          ></moz-option>
          <moz-option
            value="today"
            data-l10n-id="about-sync-log-filter-date-today"
          ></moz-option>
          <moz-option
            value="7"
            data-l10n-id="about-sync-log-filter-date-7days"
          ></moz-option>
          <moz-option
            value="30"
            data-l10n-id="about-sync-log-filter-date-30days"
          ></moz-option>
        </moz-select>

        <moz-input-search
          class="filter-search"
          id="filter-search"
          data-l10n-id="about-sync-log-search-input"
        ></moz-input-search>

        <moz-button-group class="filter-actions">
          <moz-button
            id="refresh-button"
            data-l10n-id="about-sync-log-refresh-button"
          ></moz-button>
          <moz-button
            id="download-button"
            data-l10n-id="about-sync-log-download-button"
          ></moz-button>
          <moz-button
            id="clear-button"
            type="destructive"
            data-l10n-id="about-sync-log-clear-button"
          ></moz-button>
        </moz-button-group>
      </div>

      <p id="log-count" class="text-deemphasized" aria-live="polite"></p>

      <moz-box-group id="log-list" type="list"></moz-box-group>
    </main>

    <template id="log-row-template">
      <moz-box-item class="log-row">
        <span class="log-meta" slot="description"></span>
        <moz-button
          class="log-toggle"
          slot="actions"
          type="ghost"
          iconsrc="chrome://global/skin/icons/arrow-down.svg"
          aria-expanded="false"
          data-l10n-id="about-sync-log-expand"
        ></moz-button>
        <moz-button
          class="log-open-raw"
          slot="actions"
          type="ghost"
          iconsrc="chrome://global/skin/icons/open-in-new.svg"
          data-l10n-id="about-sync-log-open-raw"
        ></moz-button>
      </moz-box-item>
      <moz-box-item class="log-contents-row" hidden>
        <pre class="log-contents" tabindex="0"></pre>
      </moz-box-item>
    </template>

    <template id="empty-state-template">
      <moz-box-item id="empty-state"></moz-box-item>
    </template>
  </body>
</html>
